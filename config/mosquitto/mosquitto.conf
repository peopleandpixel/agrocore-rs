# Mosquitto Configuration for agrocore-rs
# ==========================================

# Security settings must come before any listener definitions
per_listener_settings true

# Connection limits
max_connections -1
max_keepalive 65535

# System topics
sys_interval 5

# Persistence
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Message size limits
max_packet_size 1048576  # 1 MB

# Listener for MQTT (unencrypted) - internal network only
listener 1883
protocol mqtt
allow_anonymous true

# Listener for MQTT over WebSockets (for browser clients)
listener 9001
protocol websockets
allow_anonymous true

# TLS Listener (secure MQTT) - optional, requires certificates
# listener 8883
# protocol mqtt
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# require_certificate false
# use_identity_as_username false

# Bridge to other brokers (if needed)
# connection bridge-01
# address remote-broker:1883
# topic # both 0 agrocore/ agrocore/
# remote_username bridge_user
# remote_password bridge_pass
# try_private false
# cleansession true
# start_type automatic

# WebSocket specific
# http_dir /mosquitto/www
