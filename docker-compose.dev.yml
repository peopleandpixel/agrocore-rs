services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: agrocore-postgres
    network_mode: host
    environment:
      POSTGRES_DB: agrocore
      POSTGRES_USER: agrocore
      POSTGRES_PASSWORD: agrocore
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrocore -d agrocore"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: agrocore-nats
    network_mode: host
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: agrocore-mqtt
    network_mode: host
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - dev_mqtt_data:/mosquitto/data
      - dev_mqtt_logs:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "pgrep mosquitto >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: agrocore-redis
    network_mode: host
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: agrocore-api
    network_mode: host
    environment:
      DATABASE_URL: "postgresql://agrocore:***@localhost:5432/agrocore"
      NATS_URL: "nats://localhost:4222"
      MQTT_BROKER_HOST: localhost
      MQTT_BROKER_PORT: "1883"
      MQTT_CLIENT_ID: agrocore-api
      MQTT_TOPIC_PREFIX: agrocore
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: dev-secret-change-in-production
      RUST_LOG: info
      SKIP_MIGRATIONS: "1"
      LISTEN_ADDR: "0.0.0.0:8080"
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  admin-ui:
    image: nginx:alpine
    container_name: agrocore-admin-ui
    network_mode: host
    volumes:
      - ./crates/admin-ui/dist:/usr/share/nginx/html:ro
      - ./crates/admin-ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s

volumes:
  dev_postgres_data:
  dev_mqtt_data:
  dev_mqtt_logs:
  dev_redis_data: