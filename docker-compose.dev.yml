# AgroCore Development Environment
#
# Ports are variable: dev.sh detects conflicts and exports the actual ports
# before calling `docker compose up`. Defaults keep `docker compose up` usable
# standalone.
#
# All services use the bridge network (not network_mode: host) so the port
# mappings below are actually applied.
services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: agrocore-postgres
    environment:
      POSTGRES_DB: agrocore
      POSTGRES_USER: agrocore
      POSTGRES_PASSWORD: agrocore
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrocore -d agrocore"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: agrocore-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MON_PORT:-8222}:8222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: agrocore-mqtt
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - dev_mqtt_data:/mosquitto/data
      - dev_mqtt_logs:/mosquitto/log
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "pgrep mosquitto >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: agrocore-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dev_redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    image: agrocore-api:local
    container_name: agrocore-api
    environment:
      DATABASE_URL: "postgresql://agrocore:${POSTGRES_PASSWORD:-agrocore}@postgres:5432/agrocore"
      NATS_URL: "nats://nats:4222"
      MQTT_BROKER_HOST: mqtt
      MQTT_BROKER_PORT: "1883"
      MQTT_CLIENT_ID: agrocore-api
      MQTT_TOPIC_PREFIX: agrocore
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: dev-secret-change-in-production
      RUST_LOG: info
      LISTEN_ADDR: "0.0.0.0:8080"
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  notification-service:
    image: agrocore-notification-service:local
    container_name: agrocore-notification-service
    environment:
      DATABASE_URL: "postgresql://agrocore:${POSTGRES_PASSWORD:-agrocore}@postgres:5432/agrocore"
      NATS_URL: "nats://nats:4222"
      MQTT_BROKER_HOST: mqtt
      MQTT_BROKER_PORT: "1883"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: dev-secret-change-in-production
      RUST_LOG: info
      NOTIFICATION_LISTEN_ADDR: "0.0.0.0:8082"
    ports:
      - "${NOTIFICATION_PORT:-8082}:8082"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  admin-ui:
    image: nginx:alpine
    container_name: agrocore-admin-ui
    volumes:
      - ./crates/admin-ui/dist:/usr/share/nginx/html:ro
      - ./crates/admin-ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${ADMIN_UI_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s

volumes:
  dev_postgres_data:
  dev_mqtt_data:
  dev_mqtt_logs:
  dev_redis_data: