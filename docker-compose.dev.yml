services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: agrocore-postgres
    environment:
      POSTGRES_DB: agrocore
      POSTGRES_USER: agrocore
      POSTGRES_PASSWORD: agrocore
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrocore -d agrocore"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: agrocore-nats
    ports:
      - "${NATS_PORT:-4222}:4222"
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: agrocore-mqtt
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - dev_mqtt_data:/mosquitto/data
      - dev_mqtt_logs:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "pgrep mosquitto >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: agrocore-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: agrocore-api
    environment:
      DATABASE_URL: postgresql://agrocore:***@postgres:5432/agrocore
      MQTT_BROKER_HOST: mqtt
      MQTT_BROKER_PORT: "1883"
      MQTT_CLIENT_ID: agrocore-api
      MQTT_TOPIC_PREFIX: agrocore
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production
      RUST_LOG: info
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      mqtt:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  admin-ui:
    build:
      context: .
      dockerfile: Dockerfile.admin-ui
    container_name: agrocore-admin-ui
    ports:
      - "${ADMIN_UI_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    image: agrocore-service
    container_name: agrocore-notification-service
    environment:
      DATABASE_URL: postgresql://agrocore:***@postgres:5432/agrocore
      NATS_URL: nats://nats:4222
      JWT_SECRET: dev-secret-change-in-production
      RUST_LOG: info
      SERVICE_NAME: agrocore-notification-service
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f agrocore-notification-service || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  dev_postgres_data:
  dev_mqtt_data:
  dev_mqtt_logs:
  dev_redis_data:

networks:
  default:
    name: agrocore-dev-network