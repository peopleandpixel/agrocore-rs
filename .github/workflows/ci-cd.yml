name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Quality Gates - runs on every push/PR
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo check
        run: cargo check --workspace
        env:
          # sqlx::query! offline mode — uses .sqlx/ cache instead of DB connection
          SQLX_OFFLINE: true

      - name: Run cargo clippy
        run: cargo clippy --workspace -- -D warnings
        env:
          SQLX_OFFLINE: true

      - name: Run API contract validation (prevents UI 500 errors)
        run: cargo test --test api_contract_test --features=mocks -- --nocapture
        env:
          SQLX_OFFLINE: true

  # Unit & Integration Tests
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality-gates
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: agrocore_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpq-dev

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres --version 0.8.2 --locked

      - name: Setup database
        run: |
          sqlx database create --database-url postgresql://test:${PGPASSWORD}@localhost:5432/agrocore_test
          sqlx migrate run --source migrations --database-url postgresql://test:${PGPASSWORD}@localhost:5432/agrocore_test
        env:
          DATABASE_URL: postgresql://test:${PGPASSWORD}@localhost:5432/agrocore_test
          PGPASSWORD: test

      - name: Run cargo test
        run: cargo test --workspace --features=mocks --no-fail-fast
        env:
          RUST_LOG: debug
          DATABASE_URL: postgresql://test:${PGPASSWORD}@localhost:5432/agrocore_test
          PGPASSWORD: test

  # Build Admin UI WASM
  build-wasm:
    name: Build Admin UI WASM
    runs-on: ubuntu-latest
    # Runs in parallel with test job — only needs quality-gates
    needs: quality-gates
    env:
      # sqlx::query! offline mode — .sqlx/ cache is committed to repo
      SQLX_OFFLINE: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-pack
        run: sudo curl -sSf --compressed -o /usr/local/bin/wasm-pack https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz && sudo chmod +x /usr/local/bin/wasm-pack

      - name: Build Admin UI WASM
        run: |
          wasm-pack build --target no-bundler --release --package admin-ui --out-dir target/wasm32-unknown-unknown/release
          # Copy .wasm to expected artifact path
          cp target/wasm32-unknown-unknown/release/admin_ui_bg.wasm target/wasm32-unknown-unknown/release/admin-ui.wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-wasm
          path: target/wasm32-unknown-unknown/release/admin-ui.wasm
          retention-days: 7

  # Docker Build & Test
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [quality-gates, test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        if: github.event_name != 'pull_request'

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agrocore-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/agrocore-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Admin UI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.admin-ui
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agrocore-admin-ui:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/agrocore-admin-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Security Audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit
        continue-on-error: true

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Run dependency check
        run: cargo deny check advisories licenses bans sources
        continue-on-error: true

  # Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [quality-gates, test, build-wasm, docker, security]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate changelog
        run: |
          echo "## Changes" > RELEASE_NOTES.md
          git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/wasm32-unknown-unknown/release/admin-ui.wasm
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false