name: Security Audit

on:
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday 3 AM
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Security Audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.RUSTSEC_AUDIT_TOKEN || '' }}