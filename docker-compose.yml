version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: agrocore-postgres
    environment:
      POSTGRES_DB: agrocore
      POSTGRES_USER: agrocore
      POSTGRES_PASSWORD: agrocore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrocore -d agrocore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MQTT Broker (Mosquitto)
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: agrocore-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/mosquitto/certs:/mosquitto/certs:ro
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "127.0.0.1", "-t", "$SYS/broker/version", "-C", "1", "-i", "healthcheck", "-W", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: agrocore-api
    environment:
      DATABASE_URL: postgresql://agrocore:agrocore@postgres:5432/agrocore
      MQTT_BROKER_HOST: mqtt
      MQTT_BROKER_PORT: "1883"
      MQTT_CLIENT_ID: agrocore-api
      MQTT_TOPIC_PREFIX: agrocore
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      RUST_LOG: info
      RUST_BACKTRACE: 1
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Admin UI (Nginx + WASM)
  admin-ui:
    build:
      context: .
      dockerfile: Dockerfile.admin-ui
    container_name: agrocore-admin-ui
    ports:
      - "80:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    image: agrocore-service
    container_name: agrocore-notification-service
    environment:
      DATABASE_URL: postgresql://agrocore:${POSTGRES_PASSWORD}@postgres:5432/agrocore
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET}
      RUST_LOG: info
      SERVICE_NAME: agrocore-notification-service
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f agrocore-notification-service || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  mqtt_data:
  mqtt_logs:

networks:
  default:
    name: agrocore-network