version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: agrocore-postgres
    environment:
      POSTGRES_DB: agrocore
      POSTGRES_USER: agrocore
      POSTGRES_PASSWORD: agrocore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrocore -d agrocore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: agrocore-api
    environment:
      DATABASE_URL: postgresql://agrocore:agrocore@postgres:5432/agrocore
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      RUST_LOG: info
      RUST_BACKTRACE: 1
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Admin UI (Nginx + WASM)
  admin-ui:
    build:
      context: .
      dockerfile: Dockerfile.admin-ui
    container_name: agrocore-admin-ui
    ports:
      - "80:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:

networks:
  default:
    name: agrocore-network