services:
  build-base:
    build:
      context: .
      dockerfile: Dockerfile.base-build
    image: agrocore-build-base:latest

  postgres:
    image: postgis/postgis:latest
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agrocore
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "8222:8222"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      - build-base
      - postgres
      - nats
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/agrocore
      - NATS_URL=nats://nats:4222
      - LISTEN_ADDR=0.0.0.0:3000
      - JWT_SECRET=dev-secret

  reporting-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: agrocore-reporting-service
    depends_on:
      - build-base
      - postgres
      - nats
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/agrocore
      - NATS_URL=nats://nats:4222

  weather-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_NAME: agrocore-weather-service
    depends_on:
      - build-base
      - postgres
      - nats
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/agrocore
      - NATS_URL=nats://nats:4222

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/log:/var/log
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
      - loki

  admin-ui:
    build:
      context: .
      dockerfile: Dockerfile.admin-ui
    ports:
      - "5173:5173"
    environment:
      - API_URL=http://api:3000
    depends_on:
      - api

volumes:
  postgres_data:
