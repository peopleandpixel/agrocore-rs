[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.9.1"
authors = ["Jens Reinemuth <jens@reinemuth.pt>"]
license = "GPL-3.0-or-later"
edition = "2024"


[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
actix-web = "4"
actix-cors = "0.7"
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
argon2 = "0.5.1"
password-hash = "0.5"
rand = "0.8"
validator = { version = "0.20", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"
utoipa = { version = "5", features = ["actix_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "8", features = ["actix-web", "vendored"] }
actix-web-prometheus = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
config = "0.15"
dotenvy = "0.15"
geo = "0.33"
geojson = "1.0"
rust_xlsxwriter = "0.95.0"
actix-files = "0.6"
actix-governor = "0.10"
futures = "0.3"
async-nats = "0.50"
mockall = "0.13"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "macros", "uuid", "chrono", "ipnetwork", "bigdecimal", "json"] }
geozero = { version = "0.15", features = ["with-postgis-sqlx", "with-geo", "with-shp", "with-geojson"] }
strum = { version = "0.26", features = ["derive"] }
quick-xml = { version = "0.41", features = ["serialize"] }
urlencoding = "2.1"

moka = { version = "0.12", features = ["sync", "future"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager", "json"] }
governor = { version = "0.6", features = ["jitter"] }
retry = { version = "0.1" }
jitter = { version = "0.1" }
rumqttc = { version = "0.25", features = ["use-rustls-no-provider"] }
