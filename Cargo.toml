[workspace]
members = [
    "crates/shared",
    "crates/domain",
    "crates/infrastructure",
    "crates/api",
    "crates/admin-ui",
    "crates/messaging",
    "crates/lpis-providers",
    "crates/reporting-service",
    "crates/geometry-service",
    "crates/asset-registry",
    "crates/weather-service",
    "crates/i18n-shared",
    "crates/dashboard",
    "crates/backup-service",
    "crates/scheduler",
    "crates/logging",
]
resolver = "2"

[workspace.package]
version = "0.19.0"
authors = ["Jens Reinemuth <jens@reinemuth.pt>"]
license = "GPL-3.0-or-later"
edition = "2024"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
debug = "line-tables-only"

[profile.dev]
debug = false


[workspace.dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time", "io-util"] }
actix-web = "4.15.0"
actix-cors = "0.7.2"
reqwest = { version = "0.13.5", features = ["json", "rustls"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
argon2 = "0.6.0"
password-hash = "0.6"
rand = "0.10.2"
validator = { version = "0.21.0", features = ["derive"] }
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = { version = "0.1.44", features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-actix-web = "0.7.22"
utoipa = { version = "5.5.0", features = ["actix_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web", "vendored"] }
actix-web-prometheus = "0.1.2"
prometheus = "0.14.0"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.26.1", features = ["v4", "v5", "serde"] }
config = "0.15.25"
dotenvy = "0.15.7"
log = "0.4.34"
geo = "0.33.1"
geojson = "1.0.0"
rust_xlsxwriter = "0.99.0"
actix-files = "0.7.0"
actix-governor = "0.10.0"
futures = "0.3.34"
async-nats = "0.50.0"
mockall = "0.15.0"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "macros", "uuid", "chrono", "ipnetwork", "bigdecimal", "json", "runtime-tokio-rustls", "tls-rustls"] }
geozero = { version = "0.15.1", features = ["with-postgis-sqlx", "with-geo", "with-shp", "with-geojson"] }
strum = { version = "0.28.0", features = ["derive"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
urlencoding = "2.1.3"

moka = { version = "0.12.16", features = ["sync", "future"] }
redis = { version = "1.7.0", features = ["tokio-comp", "connection-manager", "json"] }
governor = { version = "0.10.4", features = ["jitter"] }
retry = "2.2.0"
rumqttc = { version = "0.25.1", features = ["use-rustls-no-provider"] }
bytes = "1.12.1"
cron = "0.17.0"
