<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine Aufgaben - Offline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
</head>
<body class="min-h-screen bg-base-200">
  <div class="max-w-2xl mx-auto p-4">
    <!-- Offline Header -->
    <div class="card bg-warning bg-opacity-10 border-warning mb-4">
      <div class="card-body">
        <div class="flex items-center gap-3">
          <div class="text-2xl">📴</div>
          <div>
            <h3 class="font-bold">Offline Modus</h3>
            <p class="text-sm opacity-80">Zuletzt synchronisiert: <span id="lastSync">Lade...</span></p>
          </div>
        </div>
      </div>
    </div>

    <!-- Cached Tasks -->
    <div class="space-y-3" id="tasksContainer">
      <div class="loading loading-spinner loading-lg mx-auto"></div>
    </div>

    <!-- Sync Button -->
    <div class="fixed bottom-4 right-4 z-50">
      <button id="syncBtn" class="btn btn-primary btn-circle btn-lg shadow-xl" onclick="syncNow()" disabled>
        <svg class="w-6 h-6 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
      </button>
    </div>
  </div>

  <script>
    // Load cached tasks from IndexedDB
    async function loadCachedTasks() {
      const container = document.getElementById('tasksContainer');
      
      try {
        const db = await openDB();
        const tx = db.transaction('cachedTasks', 'readonly');
        const store = tx.objectStore('cachedTasks');
        const tasks = await store.getAll();
        
        if (tasks.length === 0) {
          container.innerHTML = `
            <div class="card bg-base-100 shadow text-center py-12">
              <div class="text-6xl mb-4">📋</div>
              <h3 class="text-xl font-bold mb-2">Keine zwischengespeicherten Aufgaben</h3>
              <p class="text-base-content/60">Verbinden Sie sich mit dem Internet, um Ihre Aufgaben zu laden.</p>
            </div>
          `;
          return;
        }
        
        // Get last sync time
        const syncTime = localStorage.getItem('agrocore.lastWorkerTasksSync');
        document.getElementById('lastSync').textContent = syncTime 
          ? new Date(syncTime).toLocaleString('de-DE') 
          : 'Unbekannt';
        
        container.innerHTML = tasks.map(task => `
          <div class="card bg-base-100 shadow-sm">
            <div class="card-body p-4">
              <div class="flex items-start justify-between gap-3">
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 mb-2">
                    <span class="badge badge-sm badge-outline">${task.order_type || 'Auftrag'}</span>
                    <span class="badge badge-sm ${getStatusBadge(task.status)}">${task.status || 'Offen'}</span>
                  </div>
                  <h4 class="font-semibold text-lg truncate">${task.label || 'Ohne Titel'}</h4>
                  <p class="text-sm text-base-content/60 mt-1">${task.description || ''}</p>
                  ${task.site_name ? `<p class="text-xs text-base-content/50 mt-1">📍 ${task.site_name}</p>` : ''}
                </div>
                <div class="flex flex-col gap-2">
                  <button class="btn btn-sm btn-primary" onclick="startTaskOffline('${task.id}')" ${task.status === 'InProgress' ? 'disabled' : ''}>
                    ${task.status === 'InProgress' ? '⏸ Pausieren' : '▶ Starten'}
                  </button>
                  <button class="btn btn-sm btn-outline" onclick="viewTaskDetails('${task.id}')" disabled>
                    Details
                  </button>
                </div>
              </div>
              
              <!-- Offline actions queue -->
              <div id="offlineActions-${task.id}" class="mt-3 p-3 bg-base-200 rounded-lg hidden">
                <p class="text-xs text-base-content/60 mb-2">Aktionen werden synchronisiert, wenn Sie wieder online sind:</p>
                <ul class="text-xs space-y-1" id="pendingActions-${task.id}"></ul>
              </div>
            </div>
          </div>
        `).join('');
        
        // Enable sync button
        document.getElementById('syncBtn').disabled = false;
        
      } catch (error) {
        console.error('Failed to load cached tasks:', error);
        container.innerHTML = `
          <div class="card bg-error bg-opacity-10 border-error text-center py-8">
            <div class="text-6xl mb-4">⚠️</div>
            <h3 class="text-xl font-bold mb-2">Fehler beim Laden</h3>
            <p class="text-base-content/60">Zwischengespeicherte Aufgaben konnten nicht geladen werden.</p>
          </div>
        `;
      }
    }
    
    function getStatusBadge(status) {
      switch (status) {
        case 'InProgress': return 'badge-warning';
        case 'Completed': return 'badge-success';
        case 'Paused': return 'badge-info';
        default: return 'badge-ghost';
      }
    }
    
    async function startTaskOffline(taskId) {
      // Queue the action for later sync
      const db = await openDB();
      const tx = db.transaction('pendingStatusUpdates', 'readwrite');
      const store = tx.objectStore('pendingStatusUpdates');
      
      await store.add({
        taskId,
        action: 'start',
        timestamp: new Date().toISOString(),
        url: `/api/v1/workforce/tasks/${taskId}/status`,
        headers: { 'Content-Type': 'application/json' },
        body: { status: 'InProgress' }
      });
      
      // Update UI immediately
      const btn = event.target;
      btn.textContent = '⏸ Pausieren';
      btn.classList.remove('btn-primary');
      btn.classList.add('btn-warning');
      
      // Show pending action
      showPendingAction(taskId, 'Aufgabe gestartet (offline)');
      
      // Register background sync
      if ('serviceWorker' in navigator && 'sync' in window.ServiceWorkerRegistration.prototype) {
        const registration = await navigator.serviceWorker.ready;
        await registration.sync.register('sync-task-status');
      }
    }
    
    function showPendingAction(taskId, action) {
      const container = document.getElementById(`offlineActions-${taskId}`);
      const list = document.getElementById(`pendingActions-${taskId}`);
      if (container && list) {
        container.classList.remove('hidden');
        list.innerHTML += `<li class="flex items-center gap-2 text-green-600">✓ ${action}</li>`;
      }
    }
    
    async function syncNow() {
      const btn = document.getElementById('syncBtn');
      btn.disabled = true;
      btn.innerHTML = `
        <svg class="w-6 h-6 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
      `;
      
      try {
        // Try to sync with server
        await fetch('/api/v1/orders/my-tasks', { 
          method: 'GET', 
          credentials: 'include',
          cache: 'no-store'
        });
        
        // If successful, reload the page
        window.location.reload();
      } catch (error) {
        // Still offline, show message
        btn.disabled = false;
        btn.innerHTML = `
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
        `;
        alert('Noch offline. Versuchen Sie es später erneut.');
      }
    }
    
    function viewTaskDetails(taskId) {
      alert('Details sind offline nicht verfügbar. Bitte gehen Sie online für volle Funktionalität.');
    }
    
    // IndexedDB helper
    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('AgroCoreOfflineDB', 1);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains('pendingStatusUpdates')) {
            db.createObjectStore('pendingStatusUpdates', { keyPath: 'id', autoIncrement: true });
          }
          if (!db.objectStoreNames.contains('cachedTasks')) {
            db.createObjectStore('cachedTasks', { keyPath: 'id' });
          }
        };
      });
    }
    
    // Check online status
    function updateOnlineStatus() {
      const syncBtn = document.getElementById('syncBtn');
      if (navigator.onLine) {
        syncBtn.classList.remove('btn-outline');
        syncBtn.classList.add('btn-primary');
        syncBtn.title = 'Jetzt synchronisieren';
      } else {
        syncBtn.classList.remove('btn-primary');
        syncBtn.classList.add('btn-outline');
        syncBtn.title = 'Offline - Synchronisation nicht möglich';
      }
    }
    
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    
    // Initialize
    loadCachedTasks();
    updateOnlineStatus();
    
    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.log('SW registration failed:', err));
    }
  </script>
</body>
</html>
