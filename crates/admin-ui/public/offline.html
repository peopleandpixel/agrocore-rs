<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroCore - Offline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
</head>
<body class="min-h-screen flex items-center justify-center bg-base-200">
  <div class="card w-96 bg-base-100 shadow-xl">
    <div class="card-body text-center">
      <div class="text-6xl mb-4">📴</div>
      <h2 class="card-title text-2xl">Offline Modus</h2>
      <p class="text-base-content/70 mb-6">
        Sie sind derzeit offline. Einige Funktionen sind eingeschränkt verfügbar.
      </p>
      <div class="flex gap-2 justify-center">
        <button class="btn btn-primary" onclick="window.location.reload()">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          Erneut versuchen
        </button>
        <button class="btn btn-outline" onclick="checkOnline()">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"></path>
          </svg>
          Status prüfen
        </button>
      </div>
      <div class="mt-4 p-4 bg-base-200 rounded-lg text-sm text-base-content/60">
        <p>Zwischengespeicherte Daten:</p>
        <ul class="list-disc list-inside mt-2 text-left">
          <li>Meine Aufgaben (letzter Sync)</li>
          <li>Standorte & Geräte</li>
          <li>Wetter-Daten</li>
        </ul>
      </div>
    </div>
  </div>
  <script>
    async function checkOnline() {
      try {
        const response = await fetch('/api/v1/system/status', { method: 'HEAD', cache: 'no-store' });
        if (response.ok) {
          window.location.reload();
        } else {
          alert('Noch offline');
        }
      } catch {
        alert('Noch offline');
      }
    }
    
    // Auto-retry when online
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
