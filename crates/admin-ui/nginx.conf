server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # The service worker. Two requirements, both easy to miss:
    #
    # * `no-cache` — the browser revalidates the worker script on every navigation.
    #   A worker that is itself cached forever can never be updated, and the update is
    #   what applies a new cache version to an already-installed worker.
    # * `Service-Worker-Allowed` is not set because the worker is served from the root,
    #   which is the scope it is registered for. If it were ever moved under
    #   `/public/`, that header would be required.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # The offline fallback pages are precached and must never be stale, or a client
    # with no network is shown an older explanation of a different failure.
    location = /offline.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.json {
        add_header Cache-Control "public, max-age=3600";
    }

    # Vendored stylesheets and scripts. These are referenced by an unversioned path,
    # so they are not immutable in the way a content-hashed asset is — a new deploy
    # replaces the file at the same URL. Long max-age keeps repeat loads cheap; the
    # version bump in the file name is what invalidates, and it is handled by the
    # service worker's cache versioning rather than by the URL.
    location /vendor/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # WASM files - match all wasm files including hashed names
    location ~* \.wasm$ {
        add_header Content-Type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy.
    #
    # The upstream is a variable rather than a literal, because nginx resolves an
    # upstream host *at startup* and aborts if it cannot. With `proxy_pass http://api:8080`
    # baked in, the container refused to start outside a Docker Compose network —
    # `host not found in upstream "api"` — which meant the image could be built but
    # never run on its own, and no offline check against a real server was possible.
    #
    # In Compose the name `api` resolves on the shared network; standalone it can be
    # set to anything reachable. Default keeps the Compose behaviour.
    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}

# The API upstream.
#
# Three separate mistakes were made here, each one a startup failure that looked like an
# unrelated problem:
#
# 1. `proxy_pass http://api:8080` -- nginx resolves a literal upstream at startup and
#    aborts when it cannot (`host not found in upstream "api"`). `api` is a Docker
#    Compose service name, so the image built but never ran standalone.
# 2. `proxy_pass http://${AGROCORE_API_UPSTREAM:api:8080}` -- that `${VAR:default}`
#    syntax is envsubst's, not nginx's. nginx rejected it with
#    `the closing bracket in "..." variable is missing`.
# 3. `env AGROCORE_API_UPSTREAM;` inside this file -- `env` is main-context only, and
#    conf.d/*.conf is included from http{}, so it is never legal here
#    (`"env" directive is not allowed here`).
#
# Using a variable in proxy_pass is the actual fix: the name is resolved per request
# rather than at startup, so an unresolvable API host no longer prevents nginx from
# starting. Compose keeps working because `api_upstream` defaults to the Compose name.
# A deployment that needs a different host overrides this map, or mounts its own config.
map $host $api_upstream {
    default api:8080;
}
