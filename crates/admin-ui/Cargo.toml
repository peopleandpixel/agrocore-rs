[package]
name = "admin-ui"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
leptos = { version = "0.8.19", features = ["csr"] }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8.13" }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
leptos_icons = "0.6"
icondata = { version = "0.7", features = ["lucide", "ico-moon-free"] }
icondata_lu = "0.1"
icondata_im = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "Document", "HtmlAnchorElement", "HtmlDivElement", "HtmlElement", "Storage", "Url", "Window"] }
uuid = { workspace = true, features = ["v4", "serde", "js"] }
chrono = { workspace = true, features = ["serde"] }
tracing = "0.1"
rust-i18n = "4"

[package.metadata.i18n]
load-path = "locales"
default-locale = "en"
available-locales = ["en", "de", "es", "fr", "pt", "it", "pl", "ro", "uk", "nl"]