[package]
name = "admin-ui"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
leptos = { version = "0.8.19", features = ["csr"] }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8.13" }
agrocore-shared = { path = "../shared", features = [] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
leptos_icons = "0.6"
icondata = { version = "0.7", features = ["lucide", "ico-moon-free"] }
icondata_lu = "0.1"
icondata_im = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "Document", "HtmlAnchorElement", "HtmlDivElement", "HtmlElement", "HtmlInputElement", "File", "FileList", "Storage", "Url", "Window", "EventTarget"] }
uuid = { workspace = true, features = ["v4", "serde", "js"] }
getrandom = { version = "0.2", features = ["js"] }
chrono = { workspace = true, features = ["serde"] }
tracing = "0.1"
wasm-bindgen-futures = "0.4"
base64 = "0.23"
rust-i18n = "4"
# tokio — wasm-compatible features only (no io-std/net/fs/rt-multi-thread for wasm)
tokio = { version = "1", default-features = false, features = ["sync", "time", "macros", "io-util", "rt"] }

[package.metadata.i18n]
load-path = "locales"
default-locale = "en"
available-locales = ["en", "de", "es", "fr", "pt", "it", "pl", "ro", "uk", "nl"]