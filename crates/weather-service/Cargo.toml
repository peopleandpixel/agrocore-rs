[package]
name = "agrocore-weather-service"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
agrocore-domain = { path = "../domain" }
agrocore-infrastructure = { path = "../infrastructure" }
agrocore-shared = { path = "../shared" }
agrocore-messaging = { path = "../messaging" }
agrocore-scheduler = { path = "../scheduler" }
tokio = { workspace = true, features = ["rt-multi-thread"] }
actix-web = { workspace = true }
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
urlencoding = "2.1"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
dotenvy = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
async-nats = { workspace = true }
agrocore-logging = { path = "../logging", features = ["dev-console"] }