[package]
name = "agrocore-logging"
version.workspace = true
edition = "2024"
license.workspace = true

[features]
default = ["dev-console"]
dev-console = []           # pretty console for local dev
otlp = ["opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "tracing-opentelemetry"]  # distributed tracing

[dependencies]
# Core
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
tracing-appender = { version = "0.2", optional = true, features = ["parking_lot"] }
uuid = { workspace = true, features = ["v4", "serde"] }

# Optional features
opentelemetry = { version = "0.27", features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "trace"], optional = true }
opentelemetry-otlp = { version = "0.17", features = ["tonic"], optional = true }
tracing-opentelemetry = { version = "0.25", optional = true }

# Config
config = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
anyhow = { workspace = true }

# Internal
agrocore-shared = { path = "../shared" }