[package]
name = "agrocore-logging"
version.workspace = true
edition = "2024"
license.workspace = true

[features]
default = ["dev-console"]
dev-console = ["tracing", "tracing-subscriber", "tracing-log"]           # pretty console for local dev
otlp = ["opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "tracing-opentelemetry", "tracing", "tracing-subscriber"]  # distributed tracing

[dependencies]
# Public API - log crate facade (zero tracing coupling for consumers)
log = "0.4"

# Internal - tracing only for OTLP/console output (optional features)
tracing = { version = "0.1", features = ["std"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
tracing-log = { version = "0.2", optional = true }  # log -> tracing bridge
tracing-appender = { version = "0.2", optional = true, features = ["parking_lot"] }

# Optional features
opentelemetry = { version = "0.27", features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "trace"], optional = true }
opentelemetry-otlp = { version = "0.17", features = ["tonic"], optional = true }
tracing-opentelemetry = { version = "0.25", optional = true }

# Config
config = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
anyhow = { workspace = true }

# Internal
agrocore-shared = { path = "../shared" }
uuid = { workspace = true, features = ["v4", "serde"] }