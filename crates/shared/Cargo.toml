[package]
name = "agrocore-shared"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
serde = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
validator = { workspace = true }
agrocore-logging = { path = "../logging", features = ["dev-console"] }
utoipa = { workspace = true, features = ["actix_extras", "uuid", "chrono"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "macros", "uuid", "chrono", "migrate"], optional = true }
async-trait = "0.1"
serde_json = { workspace = true }
geo = { workspace = true }
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
tokio = { workspace = true, features = ["time"] }

[features]
# sqlx is not default - must be explicitly enabled by crates that need it
sqlx = ["dep:sqlx"]