[package]
name = "agrocore-lpis-providers"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
agrocore-shared = { path = "../shared", features = ["sqlx"] }
agrocore-domain = { path = "../domain" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
reqwest = { workspace = true, features = ["json", "rustls"], default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread"] }
geo = { workspace = true }
geojson = "1.0"
quick-xml = { version = "0.41", features = ["serialize"] }
urlencoding = "2.1"
chrono = { workspace = true }
uuid = { workspace = true }
url = "2.5"
agrocore-logging = { path = "../logging", features = ["dev-console"] }
async-compression = "0.4"
futures = { workspace = true }
bytes = "1.5"

# Configuration
config = { workspace = true }
toml = "0.8"

# Caching
moka = { workspace = true, features = ["future"] }
redis = { workspace = true }

# Rate limiting
governor = { workspace = true }

# Retry logic
retry = { version = "0.1" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
mockall = "0.13"
wiremock = "0.6"