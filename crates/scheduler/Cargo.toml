[package]
name = "agrocore-scheduler"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
# Core
tokio = { workspace = true, features = ["net", "rt-multi-thread", "io-std", "macros", "sync", "time", "fs", "signal", "process"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
agrocore-logging = { path = "../logging", features = ["dev-console"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "v5", "serde"] }
config = { workspace = true }
dotenvy = { workspace = true }

# Scheduling
tokio-cron-scheduler = { version = "0.15", features = ["signal"] }
cron = "0.17"

# Async trait support for dyn compatibility
async-trait = "0.1"

# NATS
async-nats = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
bytes = { workspace = true }

# Internal
agrocore-shared = { path = "../shared" }
agrocore-domain = { path = "../domain" }
agrocore-infrastructure = { path = "../infrastructure" }

[dev-dependencies]
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }