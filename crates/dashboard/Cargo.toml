[package]
name = "agrocore-dashboard"
version.workspace = true
edition = "2024"
license.workspace = true

[lib]
name = "agrocore_dashboard"
path = "src/lib.rs"

[[bin]]
name = "agrocore-dashboard"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "io-util", "process"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
superlighttui = { git = "https://github.com/subinium/SuperLightTUI", features = ["async"] }
chrono = { workspace = true }
