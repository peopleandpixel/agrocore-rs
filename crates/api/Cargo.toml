[package]
name = "agrocore-api"
version.workspace = true
edition = "2024"
license.workspace = true

[[test]]
name = "api_tests"
path = "tests/api_tests.rs"

[[test]]
name = "rate_limit_test"
path = "tests/rate_limit/mod.rs"

[[test]]
name = "health_test"
path = "tests/health/mod.rs"

[[test]]
name = "auth_test"
path = "tests/auth/mod.rs"

[[test]]
name = "reporting_test"
path = "tests/reporting/mod.rs"

[dependencies]
agrocore-domain = { path = "../domain" }
agrocore-infrastructure = { path = "../infrastructure" }
agrocore-shared = { path = "../shared" }
agrocore-messaging = { path = "../messaging" }
actix-web = { workspace = true }
actix-files = { workspace = true }
actix-cors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-actix-web = { workspace = true }
utoipa = { workspace = true, features = ["uuid", "chrono"] }
utoipa-swagger-ui = { workspace = true }
actix-web-prometheus = { workspace = true }
actix-governor = "0.10"
dashmap = "6"
validator = { workspace = true }
rust_xlsxwriter = { workspace = true }
geojson = { workspace = true }
geozero = { workspace = true, features = ["with-shp"] }
sqlx = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
base64 = "0.22"

[dev-dependencies]
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
