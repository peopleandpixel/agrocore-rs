[package]
name = "agrocore-api"
version.workspace = true
edition = "2024"
license.workspace = true

[[test]]
name = "api_tests"
path = "tests/api_tests.rs"

[[test]]
name = "rate_limit_test"
path = "tests/rate_limit/mod.rs"

[[test]]
name = "health_test"
path = "tests/health/mod.rs"

[[test]]
name = "auth_test"
path = "tests/auth/mod.rs"

[[test]]
name = "reporting_test"
path = "tests/reporting/mod.rs"

[[test]]
name = "workforce_test"
path = "tests/workforce_integration.rs"
required-features = ["mocks"]

[dependencies]
once_cell = "1.19"
agrocore-domain = { path = "../domain" }
agrocore-infrastructure = { path = "../infrastructure" }
agrocore-shared = { path = "../shared", features = ["sqlx"] }
agrocore-lpis-providers = { path = "../lpis-providers" }
agrocore-messaging = { path = "../messaging" }
agrocore-backup = { path = "../backup-service" }
actix-web = { workspace = true }
actix-files = { workspace = true }
actix-cors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
agrocore-logging = { path = "../logging", features = ["dev-console"] }
utoipa = { workspace = true, features = ["uuid", "chrono"] }
utoipa-swagger-ui = { workspace = true }
actix-web-prometheus = { workspace = true }
prometheus = "0.14"
actix-governor = "0.10"
dashmap = "6"
redis = { workspace = true }
validator = { workspace = true }
rust_xlsxwriter = { workspace = true }
geojson = { workspace = true }
geozero = { workspace = true, features = ["with-shp"] }
sqlx = { workspace = true, optional = true }
argon2 = { workspace = true }
password-hash = { workspace = true }
rand = { workspace = true }
base64 = "0.23"
geo = { workspace = true }
# tokio with net for server targets — not pulled in for wasm builds
tokio = { workspace = true, features = ["net", "rt-multi-thread", "io-std"] }
[features]
default = ["sqlx"]
sqlx = ["dep:sqlx"]
mocks = ["agrocore-domain/mocks", "agrocore-infrastructure/mocks", "agrocore-messaging/mocks"]

[dev-dependencies]
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
toml = "1.1"

[[test]]
name = "compliance_test"
path = "tests/compliance_integration.rs"
required-features = ["mocks"]

[[test]]
name = "olive_test"
path = "tests/olive_integration.rs"
required-features = ["mocks"]

[[test]]
name = "harvest_test"
path = "tests/harvest_integration.rs"
required-features = ["mocks"]

[[test]]
name = "livestock_test"
path = "tests/livestock_integration.rs"
required-features = ["mocks"]

[[test]]
name = "finance_test"
path = "tests/finance_integration.rs"
required-features = ["mocks"]

[[test]]
name = "sites_test"
path = "tests/sites_integration.rs"
required-features = ["mocks"]

[[test]]
name = "equipment_test"
path = "tests/equipment_integration.rs"
required-features = ["mocks"]

[[test]]
name = "weather_test"
path = "tests/weather_integration.rs"
required-features = ["mocks"]

[[test]]
name = "water_test"
path = "tests/water_integration.rs"
required-features = ["mocks"]

[[test]]
name = "reporting_integration_test"
path = "tests/reporting_integration.rs"
required-features = ["mocks"]

[[test]]
name = "api_contract_test"
path = "tests/api_contract_test.rs"
required-features = ["mocks"]
