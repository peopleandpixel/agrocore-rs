[cache]
enabled = true
backend = "memory"
default_ttl_seconds = 3600
max_entries = 10000

[rate_limit]
requests_per_second = 10
burst_size = 20

[retry]
max_attempts = 3
base_delay_ms = 100
max_delay_ms = 5000
backoff_multiplier = 2.0
