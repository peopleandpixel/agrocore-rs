[package]
name = "agrocore-infrastructure"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
agrocore-domain = { path = "../domain" }
agrocore-shared = { path = "../shared", features = ["sqlx"] }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "macros", "uuid", "chrono", "ipnetwork", "bigdecimal", "json"], optional = true }
geozero = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
chrono = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["time"] }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }

[features]
default = ["sqlx"]
sqlx = ["dep:sqlx", "agrocore-shared/sqlx"]
mocks = ["agrocore-domain/mocks"]

[dev-dependencies]
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio = { workspace = true, features = ["rt", "macros"] }