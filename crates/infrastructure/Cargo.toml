[package]
name = "agrocore-infrastructure"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
agrocore-domain = { path = "../domain" }
agrocore-shared = { path = "../shared" }
mongodb = { workspace = true, optional = true }
bson = { workspace = true, optional = true }
sqlx = { version = "0.8", features = ["postgres", "chrono", "uuid", "runtime-tokio-rustls", "json"], optional = true }
serde = { workspace = true }
serde_json = "1.0"
chrono = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }

[features]
default = ["postgres"]
postgres = ["dep:sqlx"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }