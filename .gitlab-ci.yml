# GitLab CI/CD Pipeline for agrocore-rs
# This pipeline runs on both GitLab.com and self-hosted GitLab

stages:
  - quality
  - test
  - build
  - security
  - release

variables:
  CARGO_TERM_COLOR: "always"
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"

# Cache configuration
cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cargo/registry/cache/
    - .cargo/registry/index/
    - target/
    - .cargo/git/

# Default before_script
before_script:
  - rustup component add rustfmt clippy
  - cargo --version
  - rustc --version

# Quality Gates Job
quality-gates:
  stage: quality
  image: rust:latest
  script:
    - cargo fmt --all -- --check
    - SQLX_OFFLINE=true cargo check --workspace
    - SQLX_OFFLINE=true cargo clippy --workspace -- -D warnings
  allow_failure: false
  timeout: 30m

# Unit & Integration Tests
test:
  stage: test
  image: rust:latest
  needs: [quality-gates]
  services:
    - name: postgis/postgis:16-3.4
      alias: postgres
  variables:
    POSTGRES_DB: agrocore_test
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    PGPASSWORD: test
    DATABASE_URL: "postgresql://test:${PGPASSWORD}@postgres:5432/agrocore_test"
    RUSTFLAGS: ""  # Override -D warnings for tests (proc-macro-error2 non-blocking)
  before_script:
    - rustup component add rustfmt clippy
    - cargo --version
    - rustc --version
    - apt-get update && apt-get install -y pkg-config libssl-dev libpq-dev postgresql-client
    - cargo install sqlx-cli --no-default-features --features postgres --version 0.8.2 --locked
    - |
      until pg_isready -h postgres -p 5432 -U test; do
        echo "Waiting for PostgreSQL..."
        sleep 2
      done
  script:
    - sqlx database create --database-url postgresql://test:${PGPASSWORD}@postgres:5432/agrocore_test
    - sqlx migrate run --source migrations --database-url postgresql://test:${PGPASSWORD}@postgres:5432/agrocore_test
    - cargo test --workspace --features=mocks --no-fail-fast
  allow_failure: false
  timeout: 45m

# Build Admin UI WASM
build-wasm:
  stage: build
  image: rust:latest
  needs: [quality-gates]  # Parallel to test job — only needs quality-gates
  script:
    - rustup target add wasm32-unknown-unknown
    - cargo install wasm-pack --version 0.13.1 --locked
    - export PATH="$HOME/.cargo/bin:$PATH"
    - |
      cd crates/admin-ui
      wasm-pack build --target no-bundler --release --out-dir target/wasm32-unknown-unknown/release
      cp target/wasm32-unknown-unknown/release/admin_ui_bg.wasm target/wasm32-unknown-unknown/release/admin-ui.wasm
  artifacts:
    paths:
      - crates/admin-ui/target/wasm32-unknown-unknown/release/admin-ui.wasm
    expire_in: 7 days
  allow_failure: false
  timeout: 30m

# Docker Build
docker-build:
  stage: build
  image: docker:latest
  needs: [quality-gates, test]
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker buildx create --use
    - docker buildx build --push \
        --cache-from=type=registry,ref=$CI_REGISTRY_IMAGE:buildcache \
        --cache-to=type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max \
        --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA \
        --tag $CI_REGISTRY_IMAGE:latest \
        --file Dockerfile.api .
    - docker buildx build --push \
        --cache-from=type=registry,ref=$CI_REGISTRY_IMAGE:buildcache \
        --cache-to=type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max \
        --tag $CI_REGISTRY_IMAGE/admin-ui:$CI_COMMIT_SHA \
        --tag $CI_REGISTRY_IMAGE/admin-ui:latest \
        --file Dockerfile.admin-ui .
  only:
    - main
    - develop
    - tags
  except:
    - merge_requests
  timeout: 30m

# Security Audit
security-audit:
  stage: security
  image: rust:latest
  needs: [quality-gates]
  script:
    - cargo install cargo-audit
    - cargo audit --workspace
    - cargo install cargo-deny
    - cargo deny check advisories licenses bans sources || true
  allow_failure: true
  timeout: 20m

# Release Job
release:
  stage: release
  image: rust:latest
  needs: [quality-gates, test, build-wasm, docker-build, security-audit]
  only:
    - tags
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
    - cargo install cargo-release
    - cargo release --version $CI_COMMIT_TAG --no-publish --execute
  timeout: 30m