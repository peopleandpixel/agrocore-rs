# GitLab CI/CD Configuration for Agrocore-RS
# Mirrors the GitHub Actions workflows

stages:
  - fmt
  - build
  - test
  - clippy
  - release

variables:
  CARGO_TERM_COLOR: "always"
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  DATABASE_URL: "postgres://postgres:postgres@postgres:5432/agrocore_test"
  JWT_SECRET: "ci-test-secret"

# Cache cargo registry and target directories
cache:
  key: "${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}"
  paths:
    - .cargo/registry/
    - target/
    - Cargo.lock

# Default image with Rust toolchain
rust:latest:
  image: rust:latest
  before_script:
    - rustup component add rustfmt clippy
    - cargo --version
    - rustc --version

# =====================
# Format Check Stage
# =====================
cargo_fmt:
  stage: fmt
  extends: .rust:latest
  script:
    - cargo fmt --all -- --check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"

# =====================
# Build Stage
# =====================
cargo_build:
  stage: build
  extends: .rust:latest
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: agrocore_test
  script:
    - cargo build --verbose
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"

# =====================
# Test Stage
# =====================
cargo_test:
  stage: test
  extends: .rust:latest
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: agrocore_test
  script:
    - cargo test --verbose
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"
  coverage: '/test result: ok\. (\d+) passed/'

# =====================
# Clippy Stage
# =====================
cargo_clippy:
  stage: clippy
  extends: .rust:latest
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: agrocore_test
  script:
    - cargo clippy -- -D warnings
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"

# =====================
# Release Stage (on tags)
# =====================
release:
  stage: release
  extends: .rust:latest
  image: rust:latest
  before_script:
    - rustup component add rustfmt clippy
    - cargo --version
    - rustc --version
  script:
    - cargo build --release
    - |
      echo "## Agrocore RS ${CI_COMMIT_TAG}" > release_notes.md
      echo "" >> release_notes.md
      echo "### Features" >> release_notes.md
      git log --pretty="- %s (%h)" $(git describe --tags --abbrev=0)..HEAD 2>/dev/null || echo "- Initial release" >> release_notes.md
  artifacts:
    paths:
      - target/release/agrocore-api
      - release_notes.md
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  only:
    - tags

# =====================
# Security Audit (optional)
# =====================
cargo_audit:
  stage: test
  image: rust:latest
  before_script:
    - rustup component add rustfmt clippy
    - cargo install cargo-audit --locked
  script:
    - cargo audit
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"

# =====================
# Docker Build (optional)
# =====================
docker_build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - |
      TAG="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      if [ -n "${CI_COMMIT_TAG}" ]; then
        TAG="${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
      fi
      docker build -t "$TAG" -f Dockerfile.api .
      docker push "$TAG"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v.*/
  only:
    - main
    - tags

# =====================
# Documentation Deploy (optional)
# =====================
pages:
  stage: deploy
  image: rust:latest
  before_script:
    - rustup component add rustfmt clippy
    - cargo install cargo-doc2html --locked || true
  script:
    - cargo doc --no-deps --document-private-items
    - mv target/doc public
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v.*/